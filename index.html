<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Team Task Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary" id="main-nav">
        <div class="container-fluid">
            <span class="navbar-brand">TaskFlow</span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-md-10 col-lg-8 mx-auto" id="main-content">
                <h4 id="page-title">Team Tasks</h4>
                <!-- Create Task -->
                <div class="card" id="create-task-card">
                    <div class="card-header">
                        <h6>Create New Task</h6>
                    </div>
                    <!-- Task name -->
                    <div class="card-body">
                        <form id="taskForm">
                            <div class="mb-3">
                                <label for="taskName" class="form-label">Task</label>
                                <input type="text" class="form-control" id="taskName" placeholder="Enter task name"
                                    required>
                            </div>
                    </div>
                    <!-- task Description-->
                    <div class="mb-3">
                        <label for="taskDescription" class="form-label"></label>
                        <textarea class="form-control" id="taskDescription" rows="3"
                            placeholder="Enter task description" required></textarea>
                    </div>
                    <!-- Task due date -->
                    <div class="mb-3">
                        <label for="taskDate" class="form-label"></label>
                        <input type="date" class="form-control" id="taskDate" required>
                    </div>
                    <!--Team member-->
                    <div class="mb-3">
                        <label for="taskAssigned" class="form-label"></label>
                        <select class="form-select" id="taskAssigned" required>
                            <option value="*">Select team member</option>
                            <option value="Team Member 1">Team Member 1</option>
                            <option value="Team Member 2">Team Member 2</option>
                            <option value="Team Member 3">Team Member 3</option>
                            <option value="Team Member 4">Team Member 4</option>
                            <option value="Team Member 5">Team Member 5</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Task</button>

                    <!-- Task List -->
                    <h6 id="task-list-title">Current Tasks</h6>
                    <div id="taskList"></div>
                </div>
            </div>
        </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="script.js"></script>
</body>
</html>
